<script>
(function(){
const PAY = JSON.parse(document.getElementById('payload').textContent);
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => { let s = ''; const a = new Uint8Array(u); for(let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const SKEY = 'exodo_payroll_key';
async function keyFromCode(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(PAY.salt), iterations:PAY.iter, hash:'SHA-256'}, base, 256);
}
async function openWith(bits){
  const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAY.iv)}, key, b64(PAY.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
function show(html, bits){
  try{ sessionStorage.setItem(SKEY, toB64(bits)); }catch(e){}
  document.open(); document.write(html); document.close();
}
async function attempt(){
  const inp = $('#passcodeInput'), btn = $('#lockSubmit'), err = $('#lockError');
  if(!inp.value) return;
  if(!(window.crypto && crypto.subtle && window.DecompressionStream)){ err.textContent = 'This browser cannot open the page. Use a current Chrome, Edge, Safari or Firefox.'; return; }
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try{ const bits = await keyFromCode(inp.value); const html = await openWith(bits); show(html, bits); return; }
  catch(e){ err.textContent = 'Incorrect code. Please try again.'; inp.value = ''; inp.focus(); }
  btn.disabled = false; btn.textContent = 'Unlock';
}
$('#lockSubmit').addEventListener('click', attempt);
$('#passcodeInput').addEventListener('keydown', e => { if(e.key === 'Enter') attempt(); });
(async () => {
  let saved = null; try{ saved = sessionStorage.getItem(SKEY); }catch(e){}
  if(saved){ try{ const bits = b64(saved).buffer; const html = await openWith(bits); show(html, bits); return; }catch(e){ try{ sessionStorage.removeItem(SKEY); }catch(_){} } }
  $('#card').style.visibility = 'visible'; $('#passcodeInput').focus();
})();
})();
</script>
